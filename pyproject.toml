[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "technicaldocs-ai"
version = "0.1.0"
description = "Citation-grounded technical document retrieval"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.128.2", "pydantic==2.12.5", "pydantic-settings==2.14.1",
  "uvicorn==0.48.0", "python-multipart==0.0.29", "httpx==0.28.1",
  "beautifulsoup4==4.14.3", "pypdf==5.9.0",
  "langchain==1.4.4", "langchain-text-splitters==1.1.3",
  "chromadb==1.5.9", "sentence-transformers==6.1.0", "groq==1.7.0"
]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.13.3", "mypy==1.17.1", "reportlab==4.4.9"]

[tool.setuptools.packages.find]
include = ["backend*"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
exclude = ["runtime", "frontend"]

[tool.ruff.lint]
select = ["E4","E7","E9","F"]
ignore = ["E701", "E702"]  # Compound statements retained in compact utility code.
