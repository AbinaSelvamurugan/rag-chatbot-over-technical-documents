services:
  backend:
    build: .
    env_file: .env
    volumes:
      - rag_runtime:/app/runtime
      - ./evaluation/results:/app/evaluation/results
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  rag_runtime:
